<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoboSlice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ---------- Tokens ----------
   Palette borrows from a lithography bay: cool mask-grey surfaces,
   safelight amber for whatever is selected, UV violet for exposure. */
:root {
  --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #E6EBEF;
  --surface: #F9FAFB;
  --surface-2: #EEF2F5;
  --line: #CBD4DB;
  --ink: #1C2830;
  --ink-2: #57666F;
  --amber: #B97E00;
  --amber-soft: #F6E3B4;
  --uv: #5B3FD9;
  --uv-ink: #FFFFFF;
  --uv-soft: #E7E1FF;
  --fault: #C3372C;
  --ok: #2F7D5B;
  --viewport: #DAE1E6;
  --plate: #C9D3DA;
  --grid-minor: #A9B7C2;
  --grid-major: #6F8190;
  --overlap: #5B3FD9;
  --part: #8DA1B2;
  --part-sel: #E2A41F;
  --part-oob: #D4483D;
  --section: #5B3FD9;
  --support: #AFBBC6;
  --radius-s: 6px;
  --radius-m: 10px;
  --shadow: 0 6px 24px rgba(28, 40, 48, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161B21; --surface: #1D232A; --surface-2: #252D35; --line: #34404B;
    --ink: #E2E8EC; --ink-2: #97A5B0; --amber: #F0B429; --amber-soft: #4A3A12;
    --uv: #8B74FF; --uv-ink: #120B33; --uv-soft: #2C2550; --fault: #F06A5E; --ok: #5CC796;
    --viewport: #12171C; --plate: #232C35; --grid-minor: #34414D; --grid-major: #5D6E7C;
    --overlap: #8B74FF; --part: #7189A0; --part-sel: #F0B429; --part-oob: #E8584C;
    --section: #8B74FF; --support: #56646F; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161B21; --surface: #1D232A; --surface-2: #252D35; --line: #34404B;
  --ink: #E2E8EC; --ink-2: #97A5B0; --amber: #F0B429; --amber-soft: #4A3A12;
  --uv: #8B74FF; --uv-ink: #120B33; --uv-soft: #2C2550; --fault: #F06A5E; --ok: #5CC796;
  --viewport: #12171C; --plate: #232C35; --grid-minor: #34414D; --grid-major: #5D6E7C;
  --overlap: #8B74FF; --part: #7189A0; --part-sel: #F0B429; --part-oob: #E8584C;
  --section: #8B74FF; --support: #56646F; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

/* ---------- Base ---------- */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 400 14px/1.4 var(--font); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--uv); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* ---------- Top bar ---------- */
.top {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand svg { width: 26px; height: 26px; }
.top .sp { flex: 1 1 auto; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface);
  cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.icon { padding: 0 9px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--ink); filter: brightness(1.15); }
.btn.uv { background: var(--uv); color: var(--uv-ink); border-color: var(--uv); font-weight: 600; }
.btn.small { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.danger { color: var(--fault); }
.btn[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); }
select.sel {
  height: 34px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface);
  padding: 0 28px 0 10px; max-width: 190px; cursor: pointer;
}
.prog { display: none; align-items: center; gap: 8px; min-width: 200px; }
.prog.on { display: flex; }
.prog .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); min-width: 90px; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--uv); transition: width .15s linear; }
.prog span { font-size: 12px; color: var(--ink-2); min-width: 64px; }

/* ---------- Main grid ---------- */
.main { display: grid; grid-template-columns: 78px minmax(0, 1fr) 344px; min-height: 0; }
.rail {
  display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; background: var(--surface);
  border-right: 1px solid var(--line); overflow-y: auto;
}
.tool {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 7px; border: 0; border-radius: var(--radius-s); background: none; cursor: pointer;
  font-size: 11.5px; color: var(--ink-2);
}
.tool svg.i { width: 22px; height: 22px; }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.tool[aria-pressed="true"]::before {
  content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--amber);
}
.rail .gap { flex: 1; min-height: 8px; }
.magic {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 7px;
  border: 0; border-radius: var(--radius-s); cursor: pointer; font-size: 11.5px; font-weight: 600;
  background: var(--uv); color: var(--uv-ink);
}
.magic svg.i { width: 22px; height: 22px; }
.magic:hover { filter: brightness(1.1); }

/* ---------- Viewport ---------- */
.vp { position: relative; min-width: 0; min-height: 0; background: var(--viewport); overflow: hidden; touch-action: none; }
.vp canvas { display: block; width: 100%; height: 100%; outline: none; }
.hud {
  position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: calc(100% - 200px);
}
.hud .chip {
  align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); box-shadow: var(--shadow);
}
.hud .chip.mode { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
.hud .chip:empty { display: none; }
.views { position: absolute; right: 12px; top: 12px; display: flex; gap: 0; border-radius: var(--radius-s); box-shadow: var(--shadow); }
.views button {
  height: 30px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12.5px; margin-left: -1px;
}
.views button:first-child { border-radius: var(--radius-s) 0 0 var(--radius-s); margin-left: 0; }
.views button:last-child { border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.views button:hover { background: var(--surface-2); }
.empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
}
.empty .card {
  pointer-events: auto; text-align: center; max-width: 360px; padding: 26px 26px 22px; border-radius: 14px;
  background: var(--surface); border: 1.5px dashed var(--grid-major); box-shadow: var(--shadow);
}
.empty h3 { margin: 6px 0 6px; font-size: 18px; letter-spacing: -.01em; }
.empty p { margin: 0 0 14px; color: var(--ink-2); }
.empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.empty .samples { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }
.empty .samples button { border: 0; background: none; color: var(--uv); cursor: pointer; padding: 2px 4px; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.vp.drag .dropzone { display: flex; }
.dropzone {
  display: none; position: absolute; inset: 10px; border: 2px dashed var(--uv); border-radius: 14px;
  align-items: center; justify-content: center; background: color-mix(in srgb, var(--uv) 10%, transparent);
  font-weight: 600; font-size: 16px; color: var(--uv); pointer-events: none;
}
.toasts { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: 92%; }
.toast { padding: 8px 14px; border-radius: var(--radius-s); background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: var(--shadow); animation: tin .18s ease-out; }
.toast.warn { background: var(--fault); color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }

/* ---------- Right panel ---------- */
.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
.sec { border-bottom: 1px solid var(--line); }
.sec > summary {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px; cursor: pointer; list-style: none; font-weight: 700; font-size: 14px;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2); transform: rotate(45deg); transition: transform .15s; }
.sec[open] > summary::after { transform: rotate(-135deg); }
.sec > summary .count { font-weight: 500; color: var(--ink-2); font-size: 12.5px; }
.body { padding: 2px 14px 14px; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 6px 0 10px; }
.note.warn { color: var(--fault); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.fld .in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); min-width: 0; }
.fld .in:focus-within { border-color: var(--uv); }
.fld input, .fld select { width: 100%; min-width: 0; border: 0; background: none; padding: 6px 7px; color: var(--ink); font-size: 13px; outline: none; }
.fld select { cursor: pointer; }
.fld em { font-style: normal; font-size: 11.5px; padding-right: 7px; color: var(--ink-2); }
.fld.x span::before, .fld.y span::before, .fld.z span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.fld.x span::before { background: #D25B4D; } .fld.y span::before { background: #3E9A61; } .fld.z span::before { background: #3D73C9; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.btns.tight { margin-top: 6px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 8px 0 0; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--uv); margin: 0; }
.subh { margin: 14px 0 6px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-s); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.axisrow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: end; margin-top: 8px; }
.parts { list-style: none; margin: 0; padding: 0; }
.parts li {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; padding: 7px 8px; border-radius: var(--radius-s); cursor: pointer; border: 1px solid transparent;
}
.parts li:hover { background: var(--surface-2); }
.parts li.on { background: var(--amber-soft); border-color: var(--amber); }
.parts .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.parts .meta { font-size: 11.5px; color: var(--ink-2); }
.parts .oob { font-size: 11px; font-weight: 700; color: var(--fault); border: 1px solid var(--fault); border-radius: 4px; padding: 0 5px; }
.parts .del { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 4px; border-radius: 4px; display: flex; }
.parts .del:hover { color: var(--fault); background: var(--surface); }
.lp { position: relative; background: #000; border-radius: var(--radius-s); overflow: hidden; border: 1px solid var(--line); }
.lp canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.lprow { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.lprow input[type=range] { flex: 1; accent-color: var(--uv); min-width: 0; }
.lprow input[type=number] { width: 72px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); padding: 4px 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; margin: 6px 0 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }

/* ---------- Context menu ---------- */
.menu {
  position: fixed; z-index: 50; min-width: 220px; max-width: 300px; padding: 5px; margin: 0; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow);
  max-height: calc(100vh - 20px); overflow-y: auto; display: none;
}
.menu.on { display: block; }
.menu li[role=menuitem] { padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 16px; outline: none; }
.menu li[role=menuitem] kbd { font: inherit; font-size: 11.5px; color: var(--ink-2); }
.menu li[role=menuitem]:focus, .menu li[role=menuitem]:hover { background: var(--surface-2); }
.menu li[aria-disabled="true"] { opacity: .4; cursor: default; }
.menu li.sep { height: 1px; background: var(--line); margin: 4px 6px; }
.menu li.hd { padding: 4px 10px 2px; font-size: 11.5px; color: var(--ink-2); }

/* ---------- Dialogs ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
}
dialog::backdrop { background: rgba(14, 20, 26, .45); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg header h2 { margin: 0; font-size: 17px; flex: 1; }
.dlg .content { padding: 6px 18px 16px; overflow-y: auto; }
.dlg footer { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); }
.dlg footer .sp { flex: 1; }
.derived { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-s); background: var(--surface-2); font-size: 13px; }
.derived b { font-weight: 600; }
.small-dlg { width: min(440px, calc(100vw - 24px)); }

/* ---------- Narrow screens ---------- */
@media (max-width: 860px) {
  body { overflow: auto; height: auto; }
  .app { height: auto; min-height: 100%; }
  .main { display: flex; flex-direction: column; }
  .rail { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; padding: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .tool, .magic { min-width: 64px; }
  .tool[aria-pressed="true"]::before { left: 12px; right: 12px; top: auto; bottom: -6px; width: auto; height: 3px; border-radius: 3px 3px 0 0; }
  .rail .gap { flex: 0 0 4px; }
  .vp { height: 58vh; min-height: 320px; }
  .panel { border-left: 0; overflow: visible; }
  .top .lbl { display: none; }
  .hud { max-width: calc(100% - 24px); top: 52px; }
  select.sel { max-width: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
